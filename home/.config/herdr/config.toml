onboarding = false
# herdr configuration — see `herdr --default-config` for every option.

[ui]
# Less chrome: no tab row until a workspace actually has tabs.
hide_tab_bar_when_single_tab = true

# Multiple agents running: surface the ones waiting on you first, and name
# them on their pane borders so a split is readable without focusing it.
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true

# Fuzzy-pick any repo under ~/codes/namespaces and jump to its space.
# The script lives at ~/.local/bin/herdr-project.
[[keys.command]]
key = "prefix+alt+p"
type = "popup"
command = "herdr-project"
width = "70%"
height = "60%"

[ui.sidebar.agents]
# Third row shows what the agent is currently doing, not just its name.
rows = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]
