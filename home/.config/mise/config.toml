# Global mise config. Symlinked to ~/.config/mise/config.toml by `mise run link`.
# `mise use -g` edits this file in place (it preserves comments and other keys,
# only rewriting the [tools] table).
#
# Nothing here is installed until `mise install`. Delete lines you don't want
# before running it — the language runtimes below are several GB in total.

[tools]
gh = "latest"

# --- neovim + what the config at ~/.config/nvim needs to function -----------
# https://github.com/gelleson/nvim — AstroNvim v5+, 20 language packs.
neovim = "latest"
node = "26"            # most Mason-installed LSPs are npm packages
ripgrep = "latest"     # telescope live_grep
fd = "latest"          # telescope file finding
lazygit = "latest"     # git UI, bound in AstroNvim
tree-sitter = "latest" # parser CLI
lua-language-server = "latest"
stylua = "latest"

# --- runtimes for the astrocommunity packs that config imports --------------
# Each line maps to a `{ import = "astrocommunity.pack.X" }` in community.lua.
# Trim aggressively — you probably don't write all of these.
rust = "latest"
go = "latest"
python = "3.13"
deno = "latest"   # pack.typescript-all-in-one + plugins/deno.lua
java = "latest"
zig = "latest"
dart = "latest"
# php: DISABLED. The only backends are vfox/asdf, both of which build PHP from
# source and need system libs this machine doesn't have. Worse, the vfox plugin
# throws on every config load, which breaks *all* mise commands. Re-enable only
# with a working toolchain — note pack.php and composer below both need it.
# php = "latest"
gleam = "latest"
erlang = "latest" # required by gleam

# Composer, PHP's dependency manager. Not in mise's registry, so it comes
# straight from GitHub releases. Upstream ships only composer.phar, so this
# lands on PATH as `composer.phar` — home/.local/bin/composer wraps it under
# the conventional name. Needs php, which must be installed for it to run.
"github:composer/composer" = "latest"
just = "latest"
helm = "latest"

# Not covered: pack.nix — Nix can't be managed by mise; install it separately
# if you want nil/nixd. pack.angular, .yaml, .toml, .json, .sql, .markdown and
# .php LSPs all ride on node above.

# --- agent tooling ----------------------------------------------------------
# Background terminal server for coding agents: persistent panes that survive
# disconnects, per-pane working/blocked/idle status, socket API. Single Rust
# binary. Pairs with the opencode/sidekick plugins in the nvim config.
herdr = "latest"

# --- containers -------------------------------------------------------------
# On macOS this is the CLI only. It still needs a Linux VM:
#   podman machine init && podman machine start
podman = "latest"

# Apple's native container runtime. mise unpacks the signed .pkg upstream
# ships (there is no plain binary), so the CLI lands under Payload/bin.
#   container system start   # boots the helper before first use
# NOTE: Apple targets macOS 26 for this. On macOS 15 it runs but networking
# between containers is limited — see apple/container's README.
container = "latest"

# --- shell navigation -------------------------------------------------------
# Wired up in home/.config/zsh/navigation.zsh.
zoxide = "latest" # `z` / `zi` frecency-based directory jumping
fzf = "latest"    # ctrl-r history, ctrl-t files, alt-c cd; backs `zi`
lsd = "latest"    # `tree` comes from `lsd --tree`; real tree ships source-only
# --- Homebrew formulae without Homebrew -------------------------------------
# zerobrew (`zb`) installs Homebrew formulae 5-20x faster from its own CAS.
# Upstream ships a self-contained Rust binary, so it comes from GitHub releases
# rather than its curl|bash installer. `matching` picks zb over zbx.
"github:lucasgelfond/zerobrew" = { version = "latest", matching = "zb-", rename_exe = "zb" }
"zerobrew:gum" = "latest"
# --- docker client ----------------------------------------------------------
# Client only — the daemon comes from OrbStack, which is a signed .app and so
# CANNOT be declared here (no cask support in mise's registry or in zb; `zb
# install orbstack` fails as "missing formula"). It is the one thing on this
# machine a rebuild will not restore. See the README.
#
# OrbStack registers its own `orbstack` docker context on launch, so these need
# no DOCKER_HOST and no shell config to find it.
docker-cli = "latest"
docker-compose = "latest"
flyctl = "latest"
bun = "latest"
uv = "latest"

[plugins]
# Backend plugin so formulae can be declared here as `"zerobrew:jq" = "latest"`
# and installed through zb. Not auto-installed: run
#   mise plugins install zerobrew
zerobrew = "https://github.com/kennyg/mise-zerobrew"

[settings]
# Auto-install missing tools when a project's config requests them.
not_found_auto_install = true

# Don't read .nvmrc / .python-version etc. unless explicitly wanted — keeps
# resolution predictable and coming from mise config only.
idiomatic_version_file_enable_tools = []
