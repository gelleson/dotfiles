# Global mise config. Symlinked to ~/.config/mise/config.toml by `mise run link`.
# `mise use -g` edits this file in place (it preserves comments and other keys,
# only rewriting the [tools] table).
#
# Nothing here is installed until `mise install`. Delete lines you don't want
# before running it — the language runtimes below are several GB in total.

[tools]
gh = "latest"

# --- neovim + what the config at ~/.config/nvim needs to function -----------
# https://github.com/gelleson/nvim — AstroNvim v5+, 20 language packs.
neovim = "latest"
node = "26"            # most Mason-installed LSPs are npm packages
ripgrep = "latest"     # telescope live_grep
fd = "latest"          # telescope file finding
lazygit = "latest"     # git UI, bound in AstroNvim
tree-sitter = "latest" # parser CLI
lua-language-server = "latest"
stylua = "latest"

# --- runtimes for the astrocommunity packs that config imports --------------
# Each line maps to a `{ import = "astrocommunity.pack.X" }` in community.lua.
# Trim aggressively — you probably don't write all of these.
# components: the rustup toolchain ships neither by default. Without
# rust-analyzer the `~/.cargo/bin` shim falls through to the mise shim and back,
# and nvim's LSP dies on "infinite recursion". rust-src is go-to-def into std.
rust = { version = "latest", components = "rust-analyzer,rust-src" }
# Exact pin, not "latest": mise's version index (mise-versions.jdx.dev) still
# tops out at 1.26.6, so both "latest" and a "1.27" prefix fail to resolve.
# Back to "latest" once `mise ls-remote go` lists 1.27.x.
go = "1.27.0"
python = "3.13"
deno = "latest"   # pack.typescript-all-in-one + plugins/deno.lua
java = "latest"
zig = "latest"
dart = "latest"
# php: DISABLED. The only backends are vfox/asdf, both of which build PHP from
# source and need system libs this machine doesn't have. Worse, the vfox plugin
# throws on every config load, which breaks *all* mise commands. Re-enable only
# with a working toolchain — note pack.php and composer below both need it.
# php = "latest"
gleam = "latest"
erlang = "latest" # required by gleam

# Composer, PHP's dependency manager. Not in mise's registry, so it comes
# straight from GitHub releases. Upstream ships only composer.phar, so this
# lands on PATH as `composer.phar` — home/.local/bin/composer wraps it under
# the conventional name. Needs php, which must be installed for it to run.
"github:composer/composer" = "latest"
just = "latest"
helm = "latest"

# Not covered: pack.nix — Nix can't be managed by mise; install it separately
# if you want nil/nixd. pack.angular, .yaml, .toml, .json, .sql, .markdown and
# .php LSPs all ride on node above.

# --- agent tooling ----------------------------------------------------------
# Background terminal server for coding agents: persistent panes that survive
# disconnects, per-pane working/blocked/idle status, socket API. Single Rust
# binary. Pairs with the opencode/sidekick plugins in the nvim config.
herdr = "latest"

# --- containers -------------------------------------------------------------
# On macOS this is the CLI only. It still needs a Linux VM:
#   podman machine init && podman machine start
podman = "latest"

# Apple's native container runtime. mise unpacks the signed .pkg upstream
# ships (there is no plain binary), so the CLI lands under Payload/bin.
#   container system start   # boots the helper before first use
# NOTE: Apple targets macOS 26 for this. On macOS 15 it runs but networking
# between containers is limited — see apple/container's README.
container = "latest"

# --- shell navigation -------------------------------------------------------
# Wired up in home/.config/zsh/navigation.zsh.
zoxide = "latest" # `z` / `zi` frecency-based directory jumping
fzf = "latest"    # ctrl-r history, ctrl-t files, alt-c cd; backs `zi`
lsd = "latest"    # `tree` comes from `lsd --tree`; real tree ships source-only
# Homebrew formulae are NOT declared here — see the Brewfile at the repo root.
# zerobrew used to fill that role from this file; it was dropped for real
# Homebrew, which handles casks too. `gum` moved to the Brewfile.
# --- docker client ----------------------------------------------------------
# Client only — the daemon comes from OrbStack, a cask, so it belongs in the
# Brewfile rather than here (mise's registry has no casks). See the README.
#
# OrbStack registers its own `orbstack` docker context on launch, so these need
# no DOCKER_HOST and no shell config to find it.
docker-cli = "latest"
docker-compose = "latest"
flyctl = "latest"
bun = "latest"
# Python packaging. `python` above stays for the nvim LSPs; uv downloads its own
# interpreters under ~/.local/share/uv/python for projects. Shell side:
# .config/zsh/aliases/uv.zsh and the committed _uv/_uvx completions.
uv = "latest"
# --- secrets ----------------------------------------------------------------
# Encrypt/decrypt files in place with an age keypair. Nothing in THIS repo is
# encrypted — these are for project repos. One-time setup per machine:
#   age-keygen -o "$HOME/Library/Application Support/sops/age/keys.txt"
# sops finds that path by default; the private key stays out of git, always.
sops = "latest"
age = "latest"

# --- temporal ---------------------------------------------------------------
# The `temporal` CLI, which bundles a SQLite dev server (`temporal server
# start-dev`, aliased `tsd`). NOT the registry's `temporal`, which is the server
# distribution — that's temporal-server + sql tools and wants a real datastore.
"aqua:temporalio/cli" = "latest"

# --- node package manager ---------------------------------------------------
# Standalone build, so it doesn't ride on the node above and corepack stays out
# of it. Deliberately NOT `pnpm setup`: that wants a PNPM_HOME on PATH for
# `pnpm add -g`, and global npm packages belong in this file as `npm:<pkg>`
# instead. One-offs are `pnpm dlx`.
pnpm = "latest"

# --- env files ---------------------------------------------------------------
# varlock — schema-validated .env (`.env.schema`) plus `varlock run -- <cmd>` to
# inject resolved values. Not in mise's registry, so from GitHub releases: those
# ship a standalone binary, which keeps it off node. The catch of that choice is
# that varlock plugins come from npm and are not bundled — a project using one
# needs `varlock install-plugin <name>` first.
"github:dmno-dev/varlock" = "latest"

# --- local dev URLs ----------------------------------------------------------
# portless (vercel-labs) — stable https://<name>.localhost instead of ports.
# npm backend because its releases carry no binaries, so it runs on whatever
# node is on PATH and needs >=24: inside a project pinning node 23 or older it
# refuses to start. Its state (including a local CA private key) lives in
# ~/.portless, which stays out of this repo. See the README for the one-time
# trust/proxy steps a rebuilt machine needs.
portless = "latest"

# --- document conversion ------------------------------------------------------
# anydoc (firecrawl) — docx/pptx/xlsx/pdf -> GitHub-Flavored Markdown. Rust core
# shipped as a native binary through npm, so the npm backend rather than
# github: releases. Needs npm.package_manager = "npm" below to install.
"npm:@firecrawl/anydoc" = "latest"
agy = "latest"

[settings]
# Auto-install missing tools when a project's config requests them.
not_found_auto_install = true

# Don't read .nvmrc / .python-version etc. unless explicitly wanted — keeps
# resolution predictable and coming from mise config only.
idiomatic_version_file_enable_tools = []

# cd into a uv project and its .venv is on PATH — no `source .venv/bin/activate`,
# and it deactivates on the way out.
#
# "source", NOT true. `true` means create-then-source: mise runs `uv venv`
# in the cd hook, so entering a project whose python isn't downloaded yet blocks
# the prompt on a CPython download — and since the venv doesn't exist yet, every
# following prompt fires another `uv venv`, which piles up into a hang. "source"
# only activates a venv that already exists; `uv sync` stays explicit.
python.uv_venv_auto = "source"

# Use real npm for the `npm:` backend. The "auto" default picks mise's bundled
# aube client, which aborts non-interactively ("user aborted `mise add <pkg>`")
# and hangs waiting for a prompt on a tty — so `npm:` installs fail on a fresh
# machine, including during bootstrap.
npm.package_manager = "npm"
