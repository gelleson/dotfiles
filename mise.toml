# Repo-local mise config: tasks for managing the dotfiles themselves.
# This is NOT the global config — that lives at home/.config/mise/config.toml
# and gets symlinked to ~/.config/mise/config.toml by `mise run link`.

[tasks.link]
description = "Symlink everything under home/ into $HOME"
run = '''
set -euo pipefail
src="$MISE_PROJECT_ROOT/home"
cd "$src"
find . \( -type f -o -type l \) | sed 's|^\./||' | while read -r rel; do
  target="$HOME/$rel"
  mkdir -p "$(dirname "$target")"
  if [ -L "$target" ]; then
    rm "$target"
  elif [ -e "$target" ]; then
    if cmp -s "$target" "$src/$rel"; then
      rm "$target"
    else
      mv "$target" "$target.bak"
      echo "  backed up existing $rel -> $rel.bak"
    fi
  fi
  ln -s "$src/$rel" "$target"
  echo "  linked ~/$rel"
done
'''

[tasks.fonts]
description = "Install the Nerd Fonts referenced by the ghostty config into ~/Library/Fonts"
run = '''
set -euo pipefail
mkdir -p "$HOME/Library/Fonts"
# .tar.xz is ~12MB for all three vs ~155MB of .zip.
# Archive name : installed file prefix — skip what's already there.
for pair in ProggyClean:ProggyCleanCE BigBlueTerminal:BigBlueTerm JetBrainsMono:JetBrainsMono; do
  f="${pair%%:*}"
  if compgen -G "$HOME/Library/Fonts/${pair#*:}*NerdFont*.ttf" >/dev/null; then
    echo "  $f already installed"
    continue
  fi
  curl -fsSL "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/$f.tar.xz" \
    | tar -xJf - -C "$HOME/Library/Fonts" '*.ttf'
  echo "  installed $f"
done
'''

[tasks.unlink]
description = "Replace symlinks in $HOME with real copies (undo link)"
run = '''
set -euo pipefail
src="$MISE_PROJECT_ROOT/home"
cd "$src"
find . \( -type f -o -type l \) | sed 's|^\./||' | while read -r rel; do
  target="$HOME/$rel"
  if [ -L "$target" ]; then
    rm "$target"
    cp "$src/$rel" "$target"
    echo "  restored ~/$rel as a real file"
  fi
done
'''

[tasks.status]
description = "Show which home/ files are correctly linked"
run = '''
src="$MISE_PROJECT_ROOT/home"
cd "$src"
find . \( -type f -o -type l \) | sed 's|^\./||' | while read -r rel; do
  target="$HOME/$rel"
  if [ -L "$target" ] && [ "$(readlink "$target")" = "$src/$rel" ]; then
    echo "  ok       ~/$rel"
  elif [ -e "$target" ]; then
    echo "  UNLINKED ~/$rel (real file, differs from repo)"
  else
    echo "  MISSING  ~/$rel"
  fi
done
'''
