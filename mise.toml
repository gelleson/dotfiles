# Repo-local mise config: tasks for managing the dotfiles themselves.
# This is NOT the global config — that lives at home/.config/mise/config.toml
# and gets symlinked to ~/.config/mise/config.toml by `mise run link`.

[tools]
age = "latest"
sops = "latest"

[tasks.link]
description = "Symlink everything under home/ into $HOME"
run = '''
set -euo pipefail
src="$MISE_PROJECT_ROOT/home"
cd "$src"
find . -type f | sed 's|^\./||' | while read -r rel; do
  target="$HOME/$rel"
  mkdir -p "$(dirname "$target")"
  if [ -L "$target" ]; then
    rm "$target"
  elif [ -e "$target" ]; then
    if cmp -s "$target" "$src/$rel"; then
      rm "$target"
    else
      mv "$target" "$target.bak"
      echo "  backed up existing $rel -> $rel.bak"
    fi
  fi
  ln -s "$src/$rel" "$target"
  echo "  linked ~/$rel"
done
'''

[tasks.unlink]
description = "Replace symlinks in $HOME with real copies (undo link)"
run = '''
set -euo pipefail
src="$MISE_PROJECT_ROOT/home"
cd "$src"
find . -type f | sed 's|^\./||' | while read -r rel; do
  target="$HOME/$rel"
  if [ -L "$target" ]; then
    rm "$target"
    cp "$src/$rel" "$target"
    echo "  restored ~/$rel as a real file"
  fi
done
'''

[tasks.status]
description = "Show which home/ files are correctly linked"
run = '''
src="$MISE_PROJECT_ROOT/home"
cd "$src"
find . -type f | sed 's|^\./||' | while read -r rel; do
  target="$HOME/$rel"
  if [ -L "$target" ] && [ "$(readlink "$target")" = "$src/$rel" ]; then
    echo "  ok       ~/$rel"
  elif [ -e "$target" ]; then
    echo "  UNLINKED ~/$rel (real file, differs from repo)"
  else
    echo "  MISSING  ~/$rel"
  fi
done
'''

[tasks."key:import"]
description = "Import an age key file into the macOS keychain, then shred the file"
run = '''
set -euo pipefail
src="${1:-$HOME/.config/sops/age/keys.txt}"
[ -f "$src" ] || { echo "no key file at $src"; exit 1; }
key=$(grep '^AGE-SECRET-KEY' "$src")
security add-generic-password -a "$USER" -s sops-age-key \
  -l "sops age key (dotfiles)" -D "age private key" \
  -w "$key" -T /usr/bin/security -U
echo "imported into keychain as 'sops-age-key'"
echo "the plaintext file at $src is now redundant — remove it with:"
echo "  rm -P $src"
'''

[tasks."key:export"]
description = "Write the keychain age key back to a file (recovery / new machine)"
run = '''
set -euo pipefail
dest="${1:-$HOME/.config/sops/age/keys.txt}"
key=$(security find-generic-password -s sops-age-key -w)
mkdir -p "$(dirname "$dest")"
umask 077
{ echo "# recovered from macOS keychain"; echo "$key"; } > "$dest"
chmod 600 "$dest"
echo "wrote $dest (mode 600)"
'''

[tasks."key:status"]
description = "Show whether the age key is available and which recipient it is"
run = '''
if key=$(security find-generic-password -s sops-age-key -w 2>/dev/null); then
  echo "keychain:   present"
  echo "recipient:  $(echo "$key" | age-keygen -y 2>/dev/null)"
else
  echo "keychain:   MISSING"
fi
[ -f "$HOME/.config/sops/age/keys.txt" ] \
  && echo "key file:   still present at ~/.config/sops/age/keys.txt (plaintext)" \
  || echo "key file:   absent (good — keychain is the only copy)"
# NEVER expand SOPS_AGE_KEY itself here — ${VAR:-default} prints the VALUE
# when the var is set, which would spill the private key to the terminal.
if [ -n "${SOPS_AGE_KEY:-}" ]; then
  # Note: shell brace-length syntax is unusable in mise tasks — mise renders
  # them as Tera templates, and a brace followed by a hash opens a Tera
  # comment. Use wc instead.
  echo "env:        SOPS_AGE_KEY is set ($(printf %s "$SOPS_AGE_KEY" | wc -c | tr -d ' ') chars)"
else
  echo "env:        SOPS_AGE_KEY is not set"
fi
'''

[tasks."secrets:edit"]
description = "Open the encrypted secrets file in $EDITOR (sops decrypts in memory)"
run = 'sops "$MISE_PROJECT_ROOT/secrets/env.json"'

[tasks."secrets:show"]
description = "Print decrypted secrets to stdout (careful: plaintext on screen)"
run = 'sops -d "$MISE_PROJECT_ROOT/secrets/env.json"'

[tasks."secrets:rotate"]
description = "Re-encrypt secrets against the current .sops.yaml recipients"
run = 'sops updatekeys -y "$MISE_PROJECT_ROOT/secrets/env.json"'
