# CLIProxyAPI, shared 1:1 by the Mac and the Hetzner box. Bound to loopback;
# callers must present an api-key below. Tracked in the dotfiles repo as
# secrets/cliproxyapi.yaml, sops-encrypted; the plaintext this was decrypted
# into is gitignored, as are the OAuth tokens in the same auth-dir.
host: 127.0.0.1
port: 8317
auth-dir: ~/.cli-proxy-api
api-keys:
    - ENC[AES256_GCM,data:cn3STTpv0aXsPLlC/dWRq5mDYQhvsi0U5jG1CENvYKx0FyQttQ0sD3I9QX5DqOB6,iv:le+FpqcQQnYOagbQZROjyfLIHDLEOSqL24wlwye7thM=,tag:99lunhzPWzRf9U1zkdkrZw==,type:str]
    - ENC[AES256_GCM,data:xVZsCwr6Efk=,iv:CHnozt1N3oE0KWnSSBAzkeUnoOKx5lJvIFODtBEuBos=,tag:FIp3je0o8wRmpI+nwhczWg==,type:str]
    - ENC[AES256_GCM,data:VhSC2xU=,iv:5r2DAOBnrht6a/LmN7nXyLCxK8JeLSXRu0EjhgnQhWw=,tag:9L37jchZS/Xx/IbuPipLUw==,type:str]
# Management API and control panel, same port, localhost only. Write the
# secret-key in plaintext and the daemon bcrypts it in place on first start —
# what's below is already the hash.
remote-management:
    allow-remote: false
    secret-key: ENC[AES256_GCM,data:puaLdeWX1vUwd6lqtKtYlJdETq+0I8SDHl3JRMXxDo6s9VtVjgyC/HK9p51dzEUebMH+6JS0LYEQNrvz,iv:rc80uaO77ixROrHm+MEg5LS5ZRMUXTTUluO1n/LzpLA=,tag:MTqrRGYP+jyYSNJCW3ZMOQ==,type:str]
debug: false
# Client-visible model ids are OpenRouter slugs (vendor/model). Every credential
# in this file is unprefixed, so a slug is a literal alias and several providers
# can answer the same slug -- routing falls through them in fill-first order.
# The antigravity OAuth pool keeps its "google" prefix in its auth json;
# force-model-prefix keeps unprefixed lookups away from it.
force-model-prefix: true
# fill-first: burn the first credential before touching the next. For the codex
# pool the OAuth sub sorts before the sk-proj key (lexicographic auth ID), so the
# sub serves until exhausted, then the API key takes over.
routing:
    strategy: fill-first
# Official Anthropic API key; serves the anthropic/* slugs.
claude-api-key:
    - api-key: ENC[AES256_GCM,data:yBRo8UcM1spoK1iBA+zPJElXw7LbVWnlAOU+H+x3s9cSXmQVg9pI9hUAhnQnLeRpPkKyT2wIcP7GilNklUMJFX7RN12T5jDbxwOG0ly0ZfR+5XacuEr3owAypxnZcYHr7gSmUfj9rVZnvRwK,iv:xJTBCJxU7jEJywHg/8YbsiD4X2oNNS4KhUdqv6NIHyQ=,tag:xKBdaSt1yTvc66ec8mxWAw==,type:str]
