# CLIProxyAPI. Bound to loopback; callers must present an api-key below.
# This file is tracked; the OAuth tokens in the same auth-dir are not.
host: 127.0.0.1
port: 8317
auth-dir: ~/.cli-proxy-api
api-keys:
    - ENC[AES256_GCM,data:w/xBq9HCBOQ4+CZkq97WllrcP0G3lhUcjM94DzXdXLQdYXy1hFPAvD00j6jHw4yF,iv:lU84BspeIIeYEL6k8xVbo7alHIu1BETWhXOBRgRoMGU=,tag:gAa+O5OHotyNF1luqD4onw==,type:str]
